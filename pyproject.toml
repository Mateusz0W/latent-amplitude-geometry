[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-amplitude-geometry"
version = "0.1.0"
description = "Analysis of scattering amplitude geometry in latent space using generative models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "matplotlib",
    "torch",
    "scikit-learn",
    "umap-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
generate-data = "dataset.generator:main"   
train-vae = "training.train:main"
train-lc = "training.train_lc:main"
run-latent = "analysis.run_latent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/test"]
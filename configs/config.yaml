seed: 42
m_pi: 0.13957
s_max: 2.5
n_points: 1000          # kluczowe vs artefakty; było 128

n_physics: 10_000

n_res_options: [2]
n_res_probs: [1.0]

# masy wokół M≈1.0 i 1.2 (peak przy s=M² → ~1.0 i ~1.44)
mass_range:
  min: 0.8
  max: 1.4
width_range:
  min: 0.08
  max: 0.25           # ≈ 0.15 jak w skrypcie

# pozwól na odstęp ~0.2 (jak 1.0 vs 1.2)
mass_similarity_delta: 0.25
width_similarity_delta: 0.05

max_abs_t: 50.0

# do figur fizycznych lepiej bez skalowania
normalization: none

split:
  train: 0.8
  val: 0.1
  test: 0.1

vae:
  latent_dim: 8
  hidden_dim: [256, 128]
  batch_size: 64
  num_epochs: 500
  lr: 1.0e-3
  patience: 5
  min_delta: 0.0

linear_probing:
  lr: 1.0e-3
  num_epochs: 500
  batch_size: 64
  patience: 7
  checkpoint: results/vae/best_vae.pt
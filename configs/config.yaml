seed: 42
m_pi: 0.13957
s_max: 2.0
n_points: 128

# Independent resonance configurations; each emits K-matrix + Breit-Wigner
n_physics: 1000

n_res_options: [1, 2]
n_res_probs: [0.5, 0.5]

mass_range:
  min: 0.5
  max: 1.4
width_range:
  min: 0.05
  max: 0.25

# For n_res=2: second resonance stays near the first
mass_similarity_delta: 0.25
width_similarity_delta: 0.08

# Reject samples with NaN/Inf or max|T| above this
max_abs_t: 50.0

# none | rms | max_abs  (fit on train split only, applied to all)
normalization: rms

split:
  train: 0.8
  val: 0.1
  test: 0.1

vae:
  latent_dim: 8
  hidden_dim: [256, 128]
  batch_size: 64
  num_epochs: 80
  lr: 1.0e-3
  train_size: 0.8
  val_size: 0.1
  test_size: 0.1
  patience: 5
  min_delta: 0.0
